# Disposable local test databases only. Never use these credentials in production.
services:
  postgresql:
    image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    environment:
      POSTGRES_USER: ogiri
      POSTGRES_PASSWORD: ogiri
      POSTGRES_DB: ogiri_test
    ports:
      - "127.0.0.1:${OGIRI_PG_PORT:-5432}:5432"
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ogiri -d ogiri_test"]
      interval: 5s
      timeout: 5s
      retries: 30
  mysql:
    image: mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
    environment:
      MYSQL_ROOT_PASSWORD: root-test-only
      MYSQL_USER: ogiri
      MYSQL_PASSWORD: ogiri
      MYSQL_DATABASE: ogiri_test
    ports:
      - "127.0.0.1:${OGIRI_MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: [CMD-SHELL, "mysqladmin ping -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 30
