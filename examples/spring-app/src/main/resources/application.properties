spring.datasource.url=${OGIRI_DATABASE_URL:${OGIRI_TEST_JDBC_URL:}}
spring.datasource.username=${OGIRI_JDBC_USER:${OGIRI_TEST_JDBC_USER:ogiri}}
spring.datasource.password=${OGIRI_JDBC_PASSWORD:${OGIRI_TEST_JDBC_PASSWORD:ogiri}}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=3000
spring.mail.host=${OGIRI_SMTP_HOST:localhost}
spring.mail.port=${OGIRI_SMTP_PORT:25}
server.port=${PORT:0}
server.error.include-message=never
ogiri.account.columns=role
ogiri.change-headers-on-each-request=${OGIRI_CHANGE_HEADERS_ON_EACH_REQUEST:false}
ogiri.max-number-of-devices=${OGIRI_MAX_NUMBER_OF_DEVICES:10}
ogiri.token-lifespan=${OGIRI_TOKEN_LIFESPAN_SECONDS:1209600}s
ogiri.batch-request-buffer-throttle=${OGIRI_BATCH_REQUEST_BUFFER_THROTTLE_SECONDS:5}s
ogiri.confirmable=${OGIRI_CONFIRMABLE:false}
ogiri.reconfirmable=${OGIRI_RECONFIRMABLE:true}
ogiri.lockable=${OGIRI_LOCKABLE:false}
ogiri.maximum-attempts=${OGIRI_MAXIMUM_ATTEMPTS:20}
ogiri.unlock-strategy=${OGIRI_UNLOCK_STRATEGY:both}
ogiri.unlock-in=${OGIRI_UNLOCK_IN_SECONDS:3600}s
ogiri.paranoid=${OGIRI_PARANOID:false}
ogiri.redirect-allowlist=${OGIRI_REDIRECT_ALLOWLIST:}
ogiri.default-confirm-success-url=${OGIRI_DEFAULT_CONFIRM_SUCCESS_URL:}
ogiri.default-password-reset-url=${OGIRI_DEFAULT_PASSWORD_RESET_URL:}
ogiri.remove-tokens-after-password-reset=${OGIRI_REMOVE_TOKENS_AFTER_PASSWORD_RESET:false}
ogiri.require-client-password-reset-token=${OGIRI_REQUIRE_CLIENT_PASSWORD_RESET_TOKEN:false}
ogiri.check-current-password-before-update=${OGIRI_CHECK_CURRENT_PASSWORD_BEFORE_UPDATE:false}
ogiri.cookie-enabled=${OGIRI_COOKIE_ENABLED:false}
ogiri.reset-password-within=${OGIRI_RESET_PASSWORD_WITHIN_SECONDS:21600}s

ogiri.public-base-url=${OGIRI_PUBLIC_BASE_URL:http://127.0.0.1:${PORT:0}}
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
